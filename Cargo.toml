[package]
name = "cards"
version = "0.1.0"
edition = "2024"

[dependencies]
#bevy = { version = "0.18"} # use this when building for release
bevy = { version = "0.18", default-features = false, features = ["dynamic_linking", "2d"] }
rand = "0.10.1"


[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3